                border: none !important;

                padding: 0 !important;

    </style>
</head>
<body class="bg-sky-50 text-slate-900 selection:bg-sky-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Vector Logo UPTD SDN BANJAR TABULU 1 (Presis sesuai logo asli)
        const SchoolLogo = ({ className = "w-16 h-20" }) => (
            <svg className={className} viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M200 10 L380 60 C380 300 280 440 200 490 C120 440 20 300 20 60 Z" fill="#064e3b" stroke="#022c22" strokeWidth="8"/>
                <path d="M200 22 L368 68 C368 290 272 426 200 474 C128 426 32 290 32 68 Z" fill="#15803d" stroke="#22c55e" strokeWidth="6"/>

                <defs>

                {/* 3 Red Stars */}

                {/* Pencil & Pen */}

                    <rect x="165" y="150" width="14" height="130" rx="3" fill="#facc15" transform="rotate(-15 165 150)" stroke="#000" strokeWidth="1.5"/>

                    <polygon points="158,288 160,295 162,286" fill="#0f172a"/>
                    
                    <rect x="220" y="150" width="14" height="130" rx="3" fill="#1e3a8a" transform="rotate(15 220 150)" stroke="#facc15" strokeWidth="1.5"/>
                    <polygon points="243,275 235,295 228,271" fill="#cbd5e1" stroke="#000" strokeWidth="1.5"/>
                    <polygon points="237,288 235,295 233,286" fill="#0f172a"/>
                </g>

                {/* Padi & Kapas */}
                <g fill="#eab308" stroke="#713f12" strokeWidth="1.2">
                    <circle cx="110" cy="220" r="9"/>
                    <circle cx="100" cy="240" r="9"/>
                    <circle cx="95" cy="265" r="9"/>
                    <circle cx="98" cy="290" r="9"/>
                    <circle cx="110" cy="315" r="9"/>
                    <circle cx="125" cy="335" r="9"/>
                </g>
                <g fill="#ffffff" stroke="#15803d" strokeWidth="2">
                    <path d="M285 210 Q 295 200 305 210 Q 315 220 305 230 Q 295 240 285 230 Z" />
                    <path d="M295 235 Q 305 225 315 235 Q 325 245 315 255 Q 305 265 295 255 Z" />
                    <path d="M300 260 Q 310 250 320 260 Q 330 270 320 280 Q 310 290 300 280 Z" />
                    <path d="M295 285 Q 305 275 315 285 Q 325 295 315 305 Q 305 315 295 305 Z" />
                    <path d="M280 310 Q 290 300 300 310 Q 310 320 300 330 Q 290 340 280 330 Z" />
                </g>

                {/* Open Book */}
                <path d="M 105 365 Q 200 345 200 380 Q 200 345 295 365 L 295 405 Q 200 385 200 415 Q 200 385 105 405 Z" fill="#ffffff" stroke="#0f172a" strokeWidth="3"/>
                <line x1="200" y1="380" x2="200" y2="415" stroke="#0f172a" strokeWidth="3"/>

                <text x="200" y="438" textAnchor="middle" fill="#0f172a" fontSize="22" fontWeight="900" fontFamily="sans-serif">
                    KEC. CAMPLONG
                </text>
                <text x="200" y="462" textAnchor="middle" fill="#0f172a" fontSize="22" fontWeight="900" fontFamily="sans-serif">
                    SAMPANG
                </text>
            </svg>
        );

        function App() {
            const [page, setPage] = useState('login');
            const [pin, setPin] = useState('');
            const [showPin, setShowPin] = useState(false);
            const [loginError, setLoginError] = useState('');

            const [formData, setFormData] = useState({
                teacherName: "Da'watul Choiroh, S.Pd.I.",
                gradeClass: "Kelas 4",
                fase: "Fase B",
                semester: "Semester Ganjil",
                subject: "Matematika",
                assessmentType: "Penilaian Harian",
                difficulty: "HOTS",
                material: "Pecahan dan Desimal",
                learningGoal: "Siswa mampu mengurutkan dan membandingkan pecahan sederhana serta mengubahnya ke bentuk desimal.",
                questionCount: 10,
                questionTypes: ["Pilihan Ganda", "Isian", "Uraian"],
                academicYear: "2026/2027",
                assessmentDate: new Date().toISOString().split('T')[0],
                customInstruction: "Gunakan bahasa yang ramah anak, berikan konteks kehidupan sehari-hari di desa, dan cantumkan pedoman penskoran yang detail."
            });

            const [isLoading, setIsLoading] = useState(false);
            const [loadingStatus, setLoadingStatus] = useState('');
            const [errorMessage, setErrorMessage] = useState('');
            const [assessmentData, setAssessmentData] = useState(null);
            const [history, setHistory] = useState([]);
            const [historySearch, setHistorySearch] = useState('');
            const [isEditing, setIsEditing] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);

            useEffect(() => {
                const savedHistory = localStorage.getItem('smart_question_batalu_history');
                if (savedHistory) {
                    try {
                        setHistory(JSON.parse(savedHistory));
                    } catch (e) {
                        console.error("Failed to parse history", e);
                    }
                }
            }, []);

            useEffect(() => {
                const cls = formData.gradeClass;
                if (cls === "Kelas 1" || cls === "Kelas 2") setFormData(prev => ({ ...prev, fase: "Fase A" }));
                else if (cls === "Kelas 3" || cls === "Kelas 4") setFormData(prev => ({ ...prev, fase: "Fase B" }));
                else if (cls === "Kelas 5" || cls === "Kelas 6") setFormData(prev => ({ ...prev, fase: "Fase C" }));
            }, [formData.gradeClass]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pin === 'banjartabulu1') {
                    setLoginError('');
                    setPage('dashboard');
                } else {
                    setLoginError('PIN yang Anda masukkan salah. Silakan coba kembali.');
                }
            };

            const handleLogout = () => {
                setPin('');
                setPage('login');
            };

            const handleTypeToggle = (type) => {
                setFormData(prev => {
                    const exists = prev.questionTypes.includes(type);
                    if (exists) {
                        if (prev.questionTypes.length === 1) return prev;
                        return { ...prev, questionTypes: prev.questionTypes.filter(t => t !== type) };
                    } else {
                        return { ...prev, questionTypes: [...prev.questionTypes, type] };
                    }
                });
            };

            const generateQuestionsWithAI = async () => {
                if (!formData.material.trim()) {
                    setErrorMessage("Materi / Ruang Lingkup harus diisi.");
                    return;
                }
                if (!formData.learningGoal.trim()) {
                    setErrorMessage("Tujuan Pembelajaran harus diisi.");
                    return;
                }
                if (formData.questionCount <= 0 || isNaN(formData.questionCount)) {
                    setErrorMessage("Jumlah soal harus berupa angka bulat positif.");
                    return;
                }

                setIsLoading(true);
                setErrorMessage('');
                setLoadingStatus('AI sedang menganalisis kurikulum dan menyusun soal...');

                const systemPrompt = `Anda adalah asisten ahli penyusunan asesmen pendidikan sekolah dasar di Indonesia. Buatlah instrumen soal berdasarkan pengaturan yang diberikan guru.
Patuhi ketentuan berikut:
1. Gunakan bahasa Indonesia yang jelas, komunikatif, dan sesuai tingkat perkembangan siswa SD.
2. Sesuaikan kedalaman materi dengan kelas dan fase yang dipilih.
3. Gunakan materi dan tujuan pembelajaran sebagai acuan utama.
4. Sesuaikan soal dengan jenis asesmen dan tingkat kesulitan.
5. Pastikan setiap soal memiliki jawaban yang benar atau kriteria jawaban yang jelas.
6. Hindari pertanyaan ambigu, pilihan jawaban yang menyesatkan, dan informasi yang tidak relevan.
7. Untuk soal pilihan ganda, gunakan pilihan A, B, C, dan D serta satu jawaban benar.
8. Untuk pilihan ganda kompleks, cantumkan semua jawaban yang benar.
9. Untuk soal menjodohkan, sediakan daftar soal dan pilihan pasangan yang jelas.
10. Untuk soal uraian, berikan contoh jawaban dan pedoman penskoran.
11. Untuk soal HOTS, gunakan situasi kontekstual yang memerlukan penalaran sesuai usia siswa.
12. Buat kisi-kisi yang menunjukkan nomor soal, tujuan/indikator, materi, bentuk soal, dan tingkat kognitif.
13. Buat kunci jawaban terpisah dari lembar soal siswa.
14. Urutkan kelompok soal pada kisi-kisi dan lembar soal secara rapi: Pilihan Ganda terlebih dahulu, disusul Isian, kemudian Uraian.
15. Pastikan total jumlah soal persis ${formData.questionCount}.`;

                const userQuery = `Susun instrumen asesmen lengkap dalam format JSON terstruktur dengan detail berikut:
- Nama Guru: ${formData.teacherName}
- Sekolah: UPTD SDN BANJAR TABULU 1
- Kelas/Fase: ${formData.gradeClass} (${formData.fase})
- Semester: ${formData.semester}
- Mata Pelajaran: ${formData.subject}
- Jenis Asesmen: ${formData.assessmentType}
- Tingkat Kesulitan: ${formData.difficulty}
- Materi: ${formData.material}
- Tujuan Pembelajaran: ${formData.learningGoal}
- Total Jumlah Soal: ${formData.questionCount}
- Bentuk Soal Diberdayakan: ${formData.questionTypes.join(', ')}
- Tahun Pelajaran: ${formData.academicYear}
- Tanggal Asesmen: ${formData.assessmentDate}
- Instruksi Tambahan Guru: ${formData.customInstruction}`;

                const jsonSchema = {
                    type: "OBJECT",
                    properties: {
                        title: { type: "STRING" },
                        instructions: { type: "STRING" },
                        questions: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    number: { type: "INTEGER" },
                                    type: { type: "STRING" },
                                    questionText: { type: "STRING" },
                                    options: { 
                                        type: "ARRAY", 
                                        items: { type: "STRING" }
                                    },
                                    indicator: { type: "STRING" },
                                    cognitiveLevel: { type: "STRING" },
                                    answerKey: { type: "STRING" },
                                    explanation: { type: "STRING" },
                                    score: { type: "INTEGER" }
                                },
                                required: ["number", "type", "questionText", "indicator", "answerKey", "score"]
                            }
                        },
                        scoringRules: {
                            type: "OBJECT",
                            properties: {
                                mcScore: { type: "STRING" },
                                fillScore: { type: "STRING" },
                                essayScore: { type: "STRING" },
                                formula: { type: "STRING" },
                                maxScore: { type: "INTEGER" }
                            }
                        }
                    },
                    required: ["title", "instructions", "questions", "scoringRules"]
                };

                try {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: jsonSchema
                            }
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Gagal menghubungi layanan AI (Status: ${response.status})`);
                    }

                    const result = await response.json();
                    const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (!generatedText) {
                        throw new Error("Layanan AI tidak mengembalikan data yang sesuai.");
                    }

                    const parsedJSON = JSON.parse(generatedText);

                    const fullData = {
                        id: Date.now().toString(),
                        createdAt: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
                        metadata: { ...formData },
                        content: parsedJSON
                    };

                    setAssessmentData(fullData);
                    
                    const updatedHistory = [fullData, ...history];
                    setHistory(updatedHistory);
                    localStorage.setItem('smart_question_batalu_history', JSON.stringify(updatedHistory));

                    setPage('result');
                } catch (err) {
                    console.error(err);
                    setErrorMessage("Terjadi kesalahan saat membuat soal: " + err.message + ". Silakan coba lagi.");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSaveAssessment = () => {
                if (!assessmentData) return;
                const existingIndex = history.findIndex(h => h.id === assessmentData.id);
                let updatedHistory;
                if (existingIndex >= 0) {
                    updatedHistory = [...history];
                    updatedHistory[existingIndex] = assessmentData;
                } else {
                    updatedHistory = [assessmentData, ...history];
                }
                setHistory(updatedHistory);
                localStorage.setItem('smart_question_batalu_history', JSON.stringify(updatedHistory));
                alert("Berhasil menyimpan perubahan soal ke Riwayat!");
            };

            const handleQuestionChange = (index, field, value) => {
                const updatedQuestions = [...assessmentData.content.questions];
                updatedQuestions[index][field] = value;
                setAssessmentData({
                    ...assessmentData,
                    content: {
                        ...assessmentData.content,
                        questions: updatedQuestions
                    }
                });
            };

            const handleOptionChange = (qIndex, optIndex, value) => {
                const updatedQuestions = [...assessmentData.content.questions];
                updatedQuestions[qIndex].options[optIndex] = value;
                setAssessmentData({
                    ...assessmentData,
                    content: {
                        ...assessmentData.content,
                        questions: updatedQuestions
                    }
                });
            };

            const handleDeleteQuestion = (index) => {
                if (assessmentData.content.questions.length <= 1) {
                    alert("Soal minimal tersisa 1.");
                    return;
                }
                const updatedQuestions = assessmentData.content.questions.filter((_, i) => i !== index);
                const renumbered = updatedQuestions.map((q, i) => ({ ...q, number: i + 1 }));
                setAssessmentData({
                    ...assessmentData,
                    content: {
                        ...assessmentData.content,
                        questions: renumbered
                    }
                });
            };

            const handleAddQuestion = () => {
                const newNum = assessmentData.content.questions.length + 1;
                const newQ = {
                    number: newNum,
                    type: "Pilihan Ganda",
                    questionText: "Ketikkan pertanyaan baru di sini...",
                    options: ["Opsi A", "Opsi B", "Opsi C", "Opsi D"],
                    indicator: "Mengukur indikator pembelajaran tambahan",
                    cognitiveLevel: "C2",
                    answerKey: "Opsi A",
                    explanation: "Penjelasan jawaban baru.",
                    score: 10
                };
                setAssessmentData({
                    ...assessmentData,
                    content: {
                        ...assessmentData.content,
                        questions: [...assessmentData.content.questions, newQ]
                    }
                });
            };

            const handleCopyToClipboard = () => {
                if (!assessmentData) return;
                let text = `UPTD SDN BANJAR TABULU 1\n`;
                text += `ASESMEN: ${assessmentData.metadata.assessmentType.toUpperCase()}\n`;
                text += `Mata Pelajaran: ${assessmentData.metadata.subject} | Kelas: ${assessmentData.metadata.gradeClass}\n`;
                text += `Materi: ${assessmentData.metadata.material}\n\n`;
                text += `--- LEMBAR SOAL ---\n\n`;

                assessmentData.content.questions.forEach((q, idx) => {
                    text += `${idx + 1}. ${q.questionText}\n`;
                    if (q.options && q.options.length > 0) {
                        q.options.forEach((opt, oIdx) => {
                            const prefix = String.fromCharCode(65 + oIdx);
                            text += `   ${prefix}. ${opt}\n`;
                        });
                    }
                    text += `\n`;
                });

                navigator.clipboard.writeText(text);
                setCopySuccess(true);
                setTimeout(() => setCopySuccess(false), 3000);
            };

            const handleExportPDF = () => {
                const element = document.getElementById('printable-assessment-area');
                if (!element || !window.html2pdf) {
                    alert("Library PDF sedang dimuat. Silakan coba beberapa detik lagi.");
                    return;
                }
                const opt = {
                    margin: 10,
                    filename: `Soal_${formData.subject}_${formData.gradeClass}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                window.html2pdf().set(opt).from(element).save();
            };

            const handleExportWord = () => {
                const element = document.getElementById('printable-assessment-area');
                if (!element) return;
                
                const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
                    "xmlns:w='urn:schemas-microsoft-com:office:word' "+
                    "xmlns='http://www.w3.org/TR/REC-html40'>"+
                    "<head><meta charset='utf-8'><title>Export Word</title><style>"+
                    "body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; }"+
                    "table { border-collapse: collapse; width: 100%; }"+
                    "table, th, td { border: 1px solid black; padding: 6px; }"+
                    "</style></head><body>";
                const footer = "</body></html>";
                const sourceHTML = header + element.innerHTML + footer;

                const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
                const fileDownload = document.createElement("a");
                document.body.appendChild(fileDownload);
                fileDownload.href = source;
                fileDownload.download = `Soal_${formData.subject}_${formData.gradeClass}.doc`;
                fileDownload.click();
                document.body.removeChild(fileDownload);
            };

            const formatDateIndo = (dateStr) => {
                if (!dateStr) return "-";
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            };

            return (
                <div className="min-h-screen bg-sky-50 text-slate-900">
                    
                    {/* ==================== 1. LOGIN PIN PAGE ==================== */}
                    {page === 'login' && (
                        <div className="min-h-screen flex flex-col justify-center items-center px-4 py-12 bg-gradient-to-br from-sky-400 via-sky-300 to-sky-500 text-slate-900 relative">
                            <div className="w-full max-w-md bg-slate-100 text-slate-900 rounded-3xl shadow-2xl border-4 border-slate-200 p-8 text-center relative z-10">
                                <div className="mx-auto flex justify-center mb-4 transform hover:scale-105 transition duration-300">
                                    <SchoolLogo className="w-24 h-28 drop-shadow-md" />
                                </div>

                                <h1 className="text-2xl font-black text-sky-900 tracking-tight uppercase mb-1">
                                    AI PEMBUAT SOAL OTOMATIS
                                </h1>
                                <p className="text-xs font-bold text-sky-600 tracking-widest uppercase mb-2">
                                    SMART QUESTION BATALU 1
                                </p>
                                <p className="text-xs text-slate-500 max-w-xs mx-auto mb-6">
                                    Sistem Cerdas Penyusunan Asesmen Guru SD
                                </p>

                                <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-200 border border-sky-300 text-xs font-bold text-sky-900 mb-6">
                                    <i className="fa-solid fa-graduation-cap text-sky-600"></i>
                                    <span>UPTD SDN BANJAR TABULU 1</span>
                                </div>

                                <form onSubmit={handleLogin} className="space-y-4 text-left">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-800 uppercase mb-2">
                                            Masukkan PIN Akses Guru
                                        </label>
                                        <div className="relative">
                                            <input
                                                type={showPin ? "text" : "password"}
                                                value={pin}
                                                onChange={(e) => setPin(e.target.value)}
                                                placeholder="Masukkan PIN rahasia..."
                                                className="w-full pl-10 pr-12 py-3 bg-slate-200/80 border-2 border-sky-300 rounded-xl focus:outline-none focus:border-sky-500 text-sm font-semibold transition"
                                                required
                                            />
                                            <i className="fa-solid fa-key text-sky-500 absolute left-3 top-3.5"></i>
                                            <button
                                                type="button"
                                                onClick={() => setShowPin(!showPin)}
                                                className="absolute right-3 top-3.5 text-slate-500 hover:text-slate-800 focus:outline-none"
                                            >
                                                <i className={`fa-solid ${showPin ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    {loginError && (
                                        <div className="flex items-center gap-2 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                                            <i className="fa-solid fa-circle-exclamation text-rose-500"></i>
                                            <span>{loginError}</span>
                                        </div>
                                    )}

                                    <button
                                        type="submit"
                                        className="w-full py-3.5 px-4 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl shadow-lg shadow-sky-500/30 transition duration-200 flex items-center justify-center gap-2 text-sm border border-sky-600 cursor-pointer"
                                    >
                                        <i className="fa-solid fa-right-to-bracket"></i>
                                        <span>MASUK APLIKASI</span>
                                    </button>
                                </form>

                                                    <div className="flex-1">
